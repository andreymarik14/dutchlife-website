<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f5">
  <meta name="description" content="Голландский двор — заметки о жизни в Нидерландах. Читайте канал в Telegram.">
  <title>Голландский двор — жизнь в Нидерландах</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #202a25;
      --muted: #657069;
      --paper: #f6f8f5;
      --green: #28634e;
      --green-hover: #1e503e;
      --coral: #c85c43;
      --coral-soft: #f0cbbd;
      --line: #dce2dc;
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "Manrope", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell { width: min(1200px, calc(100% - 72px)); margin-inline: auto; }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 20px;
      text-decoration: none;
    }
    .wordmark::before { width: 3px; height: 22px; background: var(--coral); content: ""; }
    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .nav-link svg { width: 16px; height: 16px; color: var(--green); }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
      min-height: min(660px, calc(100svh - 76px));
      align-items: center;
      gap: 84px;
      padding-block: 64px 72px;
    }
    .hero-copy { animation: enter .65s ease-out both; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 22px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }
    .eyebrow::before { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); content: ""; }
    h1 {
      max-width: 560px;
      margin: 0;
      font-family: var(--serif);
      font-size: 76px;
      font-weight: 400;
      line-height: 1.04;
    }
    h1 span { color: var(--coral); }
    .intro {
      max-width: 440px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }
    .actions { margin-top: 30px; }
    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 19px;
      border: 1px solid var(--green);
      border-radius: 4px;
      background: var(--green);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease;
    }
    .button:hover { transform: translateY(-1px); background: var(--green-hover); }
    .button svg { width: 16px; height: 16px; }
    .hero-visual {
      position: relative;
      min-width: 0;
      aspect-ratio: 1 / .94;
      overflow: hidden;
      background: #d6dfd8;
      box-shadow: 9px 9px 0 var(--coral-soft);
      animation: enter .65s .12s ease-out both;
    }
    .hero-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    footer {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    footer a { color: var(--ink); text-decoration: none; }
    footer a:hover, .nav-link:hover { color: var(--green); }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 800px) {
      .shell { width: min(100% - 48px, 620px); }
      .hero {
        grid-template-columns: 1fr;
        gap: 34px;
        min-height: auto;
        padding-block: 54px 44px;
      }
      h1 { max-width: 520px; font-size: 60px; }
      .intro { max-width: 500px; }
      .hero-visual { aspect-ratio: 1.2 / 1; }
    }
    @media (max-width: 440px) {
      .shell { width: calc(100% - 36px); }
      .topbar { height: 68px; }
      .wordmark { font-size: 18px; }
      .nav-link { font-size: 12px; }
      .hero { padding-top: 42px; }
      h1 { font-size: 46px; }
      .intro { margin-top: 18px; font-size: 15px; }
      .hero-visual { aspect-ratio: 1 / .94; }
      footer { min-height: 64px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar shell">
    <a class="wordmark" href="#top" aria-label="Голландский двор, на главную">
      <span>Голландский двор</span>
    </a>
    <a class="nav-link" href="https://t.me/golandskiy_dvor" target="_blank" rel="noreferrer">
      Telegram
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </header>

  <main id="top" class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
          <p class="eyebrow">Заметки из Нидерландов</p>
          <h1 id="page-title">Голландский<br><span>двор</span></h1>
          <p class="intro">Места, люди и маленькие открытия. Нидерланды такими, какими они становятся в обычный день.</p>
        <div class="actions">
          <a class="button" href="https://t.me/golandskiy_dvor" target="_blank" rel="noreferrer">
            Читать в Telegram
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </div>
      <div class="hero-visual">
        <img src="https://images.unsplash.com/photo-1512470876302-972faa2aa9a4?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Канал и старинные дома в Амстердаме" fetchpriority="high">
      </div>
    </section>

  </main>

  <footer class="shell">
    <span>© <span id="year">2026</span> Голландский двор</span>
    <a href="https://t.me/golandskiy_dvor" target="_blank" rel="noreferrer">@golandskiy_dvor ↗</a>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
