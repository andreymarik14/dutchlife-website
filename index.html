<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3a85">
  <meta name="description" content="Голландский двор — заметки о жизни в Нидерландах. Читайте канал в Telegram.">
  <title>Голландский двор — жизнь в Нидерландах</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --delft: #1b3a85;
      --delft-deep: #10244f;
      --tile: #f3f5fa;
      --tile-dim: #b9c5e4;
      --oranje: #ff7a1f;
      --oranje-hover: #ff9446;
      --grid: rgba(243, 245, 250, .07);
      --display: "Unbounded", "Arial Black", sans-serif;
      --text: "Onest", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--tile);
      background-color: var(--delft);
      /* плиточная сетка, как на голландской изразцовой стене */
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 72px 72px;
      font-family: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell { width: min(1160px, calc(100% - 64px)); margin-inline: auto; }

    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wordmark {
      font-family: var(--display);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border: 1.5px solid var(--tile-dim);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .nav-link svg { width: 14px; height: 14px; }
    .nav-link:hover { background: var(--tile); border-color: var(--tile); color: var(--delft-deep); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      align-items: center;
      gap: 72px;
      min-height: min(700px, calc(100svh - 76px));
      padding-block: 40px 72px;
    }
    .note {
      margin: 0 0 20px;
      color: var(--tile-dim);
      font-size: 17px;
    }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(2rem, 4.7vw, 3.6rem);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -.025em;
    }
    .intro {
      max-width: 440px;
      margin: 24px 0 0;
      color: var(--tile-dim);
      font-size: 18px;
      line-height: 1.65;
    }
    .button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 36px;
      padding: 17px 26px;
      border-radius: 999px;
      background: var(--oranje);
      color: var(--delft-deep);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease;
    }
    .button:hover { background: var(--oranje-hover); transform: translateY(-2px); }
    .button svg { width: 18px; height: 18px; }

    /* ступенчатый фронтон амстердамского дома */
    .gable-wrap { filter: drop-shadow(14px 14px 0 var(--delft-deep)); }
    .gable {
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: var(--delft-deep);
      clip-path: polygon(
        0 100%, 0 56%, 13% 56%, 13% 42%, 26% 42%, 26% 28%, 38% 28%, 38% 14%,
        44% 14%, 44% 3%, 56% 3%, 56% 14%, 62% 14%, 62% 28%, 74% 28%, 74% 42%,
        87% 42%, 87% 56%, 100% 56%, 100% 100%);
    }
    .gable img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 60%;
      animation: settle 1.4s cubic-bezier(.2, .7, .2, 1) both;
    }

    footer {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-top: 1.5px solid rgba(243, 245, 250, .22);
      color: var(--tile-dim);
      font-size: 14px;
    }
    footer a { color: var(--tile); text-decoration: none; }
    footer a:hover { color: var(--oranje); }
    :focus-visible { outline: 3px solid var(--oranje); outline-offset: 4px; }

    @keyframes settle {
      from { transform: scale(1.14) translateY(4%); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    @media (max-width: 860px) {
      .shell { width: min(100% - 44px, 620px); }
      .hero { grid-template-columns: 1fr; gap: 44px; min-height: auto; padding-block: 36px 56px; }
      .gable-wrap { max-width: 440px; width: 100%; margin-inline: auto 14px; }
      h1 { font-size: clamp(2rem, 8.4vw, 3.2rem); }
    }
    @media (max-width: 440px) {
      .topbar { height: 68px; }
      .wordmark { font-size: 13px; }
      .nav-link { padding: 8px 13px; font-size: 13px; }
      .intro { font-size: 16px; }
      .note { font-size: 15px; }
      .gable-wrap { filter: drop-shadow(9px 9px 0 var(--delft-deep)); }
      footer { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar shell">
    <a class="wordmark" href="#top" aria-label="Голландский двор, на главную">Голландский двор</a>
    <a class="nav-link" href="https://t.me/golandskiy_dvor" target="_blank" rel="noreferrer">
      Telegram
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </header>

  <main id="top" class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="note">Заметки из Нидерландов</p>
        <h1 id="page-title">Голландский двор</h1>
        <p class="intro">Места, люди и маленькие открытия. Нидерланды такими, какими они становятся в обычный день.</p>
        <a class="button" href="https://t.me/golandskiy_dvor" target="_blank" rel="noreferrer">
          Читать в Telegram
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <div class="gable-wrap">
        <div class="gable">
          <img src="https://images.unsplash.com/photo-1512470876302-972faa2aa9a4?auto=format&amp;fit=crop&amp;w=1400&amp;q=85" alt="Канал и старинные дома в Амстердаме" fetchpriority="high">
        </div>
      </div>
    </section>
  </main>

  <footer class="shell">
    <span>© <span id="year">2026</span> Голландский двор</span>
    <a href="https://t.me/golandskiy_dvor" target="_blank" rel="noreferrer">@golandskiy_dvor ↗</a>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
